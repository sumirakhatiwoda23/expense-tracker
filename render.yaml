services:
  - type: web
    name: paisa-expense-ledger
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev && npm --prefix backend ci --omit=dev && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: paisa-db
          property: connectionString
      # Internal Render URLs do not use SSL. Set to "true" if you connect
      # with an external (public) database URL instead.
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: paisa-db
    plan: free
    region: oregon
    databaseName: paisa
    user: paisa
